name: Check upstream version

# Polls upstream for the newest Sonarr release and opens a PR into dev
# bumping the pinned VERSION build arg. Merging the PR runs CI; the next
# dev -> main promotion releases it.

on:
  schedule:
    - cron: "10 7 * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: version-check
  cancel-in-progress: false

jobs:
  check:
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open the bump PR
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve latest upstream version
        id: up
        run: |
          set -euo pipefail
          latest="$(curl -fsSL 'https://services.sonarr.tv/v1/update/main/changes?version=4.0.0.0&os=linuxmusl&runtime=netcore&arch=x64' | jq -r '.[0].version')"
          if ! printf '%s' "$latest" | grep -Eq '^[0-9]+(\.[0-9]+){3}$'; then
            echo "::error::Unexpected version from upstream: '$latest'"; exit 1
          fi

          current="$(sed -n 's/^ARG VERSION="\([^"]*\)".*/\1/p' Dockerfile | head -n1)"
          if [ -z "$current" ]; then
            echo "::error::Could not parse current VERSION from Dockerfile"; exit 1
          fi

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest"   >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already on latest ($current)"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Bump available: $current -> $latest"
          fi

      - name: Update Dockerfile
        if: steps.up.outputs.changed == 'true'
        env:
          LATEST: ${{ steps.up.outputs.latest }}
        run: |
          set -euo pipefail
          sed -i -E "s|^(ARG VERSION=\")[^\"]+(\".*)$|\1${LATEST}\2|" Dockerfile
          git --no-pager diff -- Dockerfile

      - name: Open pull request
        if: steps.up.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          base: dev
          branch: bump/${{ steps.up.outputs.latest }}
          delete-branch: true
          commit-message: "Bump Sonarr to ${{ steps.up.outputs.latest }}"
          title: "Bump Sonarr to ${{ steps.up.outputs.latest }}"
          body: |
            Automated upstream version bump.

            | | Version |
            | --- | --- |
            | Current | `${{ steps.up.outputs.current }}` |
            | Latest | `${{ steps.up.outputs.latest }}` |

            Source: `https://services.sonarr.tv/v1/update/main/changes` (main channel)
          labels: |
            sonarr
            automated
