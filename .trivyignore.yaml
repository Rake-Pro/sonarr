# Trivy ignore list shared by the CI preview, the release gate (CRITICAL,
# ignore-unfixed) and the weekly rescan (CRITICAL,HIGH). Every entry is scoped
# to specific files and expires; when an entry expires the scan fails again and
# the bump must be real. Format:
#
#   - id: CVE-XXXX-YYYY
#     paths: [app/bin/Example.deps.json]
#     statement: "why this is accepted and what retires it"
#     expired_at: YYYY-MM-DD

vulnerabilities:
  # --- 2026-11-06 release scan of v1.0.0 (Sonarr upstream tarball) ------------
  # Every entry below is a NuGet library inside the self-contained upstream
  # Sonarr build (app/bin/*.deps.json): SixLabors.ImageSharp 3.1.12 and
  # System.Security.Cryptography.Pkcs 8.0.1 are pinned by upstream's csproj and
  # cannot be changed by repackaging. All HIGH, none CRITICAL. They retire with
  # the next major Sonarr line (.NET 10); re-check the upstream csproj when an
  # entry expires and bump VERSION instead of renewing.

  - id: CVE-2024-43485
    # System.Text.Json 6.0.9 -> 8.0.5, 6.0.10 (HIGH)
    paths:
      - app/bin/Sonarr.RuntimePatches.deps.json
    statement: "Library bundled in the self-contained upstream Sonarr release; not changeable by repackaging. Retires with the next major Sonarr line. Bump VERSION and drop this entry, do not renew."
    expired_at: 2027-02-28
